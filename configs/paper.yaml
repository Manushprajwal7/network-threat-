# configs/paper.yaml
# Single Source of Truth for all experimental parameters, thresholds, seeds, and costs.
# Every numeric parameter in the manuscript traces to an entry in this configuration.

dataset:
  name: "CICIoT2023"
  source_cache: "audit/lofo/cache"
  train_total_flows: 5491971
  train_benign_flows: 129538
  train_attack_flows: 5362433
  train_attack_percentage: 97.641
  test_total_flows: 1176851
  num_features: 46
  num_classes: 34
  benign_class_name: "BenignTraffic"

evaluation_windows:
  window_size_flows: 60000
  batch_size_W: 100
  total_batches: 600
  attack_heavy:
    description: "Contiguous 60k flow slice from test partition matching empirical high-attack operational regime"
    slice_start: 0
    slice_end: 60000
    expected_attack_percentage: 97.60
  balanced_stratified:
    description: "Stratified 60k window with 180 pure benign, 240 mixed (binomial 50%), and 180 pure attack batches"
    pure_benign_batches: 180
    mixed_batches: 240
    pure_attack_batches: 180
    expected_attack_percentage: 50.20

seeds:
  primary_evaluation: 42
  held_out_test: 99
  multi_seed_suite: [13, 42, 99, 123, 2024]

anomaly_detection:
  model: "IsolationForest"
  n_estimators_controlled: [100, 200]
  max_samples: 256
  contamination: 0.05
  clean_training_sample_size: 20000
  calibration:
    method: "empirical_quantile_scaling"
    p5_percentile: 0.4421
    p95_percentile: 0.5284
    scale_factor: 0.80
    offset: 0.10
  decision_threshold_tau_anom: 0.50
  isolation_forest_audit:
    contaminated_raw_auc: 0.0090
    contaminated_inverted_auc: 0.9910
    clean_raw_auc: 0.9590
    ks_statistic_contaminated: 0.9499
    ks_statistic_clean: 0.8872
    interpretation: "Contaminated IF learned inverted orientation where benign was outlier and attack was inlier; clean retraining reoriented model semantically rather than increasing raw discriminative capacity"

trust_engine:
  model: "Adaptive Dynamic Trust Model (ADTM)"
  initial_trust_T0: 100.0  # Strict neutral initialization; zero label leakage
  smoothing_factor_k: 0.30 # T_t = 0.30 * T_obs + 0.70 * T_{t-1}
  component_weights:
    w_class: 0.40
    w_anom: 0.35
    w_topo: 0.15
    w_dev: 0.10
  hard_reset:
    enabled: true
    min_confidence_c_conf: 0.90
    required_class: "attack" # y_hat != BenignTraffic
    min_anomaly_s_anom: 0.50
    reset_trust_value: 10.0
  thresholds:
    tau_T: 60.0          # Distinguishes healthy from degraded trust
    tau_T_critical: 20.0 # Boundary for high-threat escalation (L3 vs L4)

topology:
  model: "Topology-Aware Risk Propagation (TARP)"
  num_nodes: 120
  synthetic_risk_distribution:
    distribution: "normal"
    mean: 0.42
    std: 0.08
    clip_min: 0.10
    clip_max: 0.90
  decision_threshold_tau_topo: 0.42
  hub_risk_boundary_tau_R_hub: 0.75
  individual_node_z_score_to_hub: 4.125
  empirical_graph_z_score_to_hub: 4.59
  batch_assignment_property: "Flows within batch b inherit identical risk R = R[b mod 120]; c_topo is constant per batch"

posture_levels:
  L0:
    name: "Nominal"
    description: "Benign verification; zero risk signals"
  L1:
    name: "Observation"
    description: "Single weak anomaly or mild trust degradation"
  L2:
    name: "Elevated"
    description: "Two concurrent security signals"
  L3:
    name: "High Threat"
    description: "Three concurrent signals with trust preserved above critical (> 20.0)"
  L4:
    name: "Severe Threat"
    description: "Three concurrent signals with trust depleted (<= 20.0) on non-hub devices"
  L5:
    name: "Critical Infrastructure Hub"
    description: "Three concurrent signals with trust depleted on high-centrality hubs (R >= 0.75); architectural extension"
  statistical_significance_l2_vs_l3:
    z_score: 6.91
    p_value: 4.75e-12

cost_matrix_ocu:
  # Action: [Benign Cost (Penalty), Attack Cost (Reward / Containment Credit)]
  Allow:
    action_id: 0
    benign_cost: 0
    attack_cost: 0
  Alert:
    action_id: 1
    benign_cost: 1
    attack_cost: -5
  Restrict:
    action_id: 2
    benign_cost: 3
    attack_cost: -10
  Quarantine:
    action_id: 3
    benign_cost: 15
    attack_cost: -20
  Block:
    action_id: 4
    benign_cost: 50
    attack_cost: -50

